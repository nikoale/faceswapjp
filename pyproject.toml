[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceswapjp"
version = "0.1.0b2"
description = "Local, consent-first face swap studio for video production (beta)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnx>=1.16",
    "insightface>=2.1,<3",
    "typer>=0.12",
]

[project.optional-dependencies]
# Apple Silicon: onnxruntime の標準 wheel に CoreML EP が含まれる
mac = ["onnxruntime>=1.20"]
cpu = ["onnxruntime>=1.20"]
cuda = ["onnxruntime-gpu>=1.20"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
classic-ui = ["gradio>=5", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "gradio>=5", "pillow>=10"]

[project.scripts]
faceswapjp = "faceswapjp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/faceswapjp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded model files (skipped otherwise)"]
