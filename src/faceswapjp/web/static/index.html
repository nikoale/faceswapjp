<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="fsj-token" content="__FSJ_TOKEN__">
  <meta name="fsj-version" content="__FSJ_VERSION__">
  <title>faceswapjp studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%233fd6f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="10" r="4"/><path d="M15 6a4 4 0 0 1 0 8M3 20c1.2-3 3.4-4.5 6-4.5s4.8 1.5 6 4.5"/></svg></div>
        faceswapjp <small>studio</small>
      </div>
      <div class="sep"></div>
      <div class="select-wrap"><select id="project" aria-label="作品"></select></div>
      <button class="btn ghost sm" id="new-project">＋ 新しい作品</button>
      <div class="spacer"></div>
      <button class="pill" id="keys-btn" title="キーボード操作 (?)" style="cursor:pointer">⌨︎ ショートカット</button>
      <span class="pill" id="device-pill"></span>
      <span class="pill" title="素材はこのパソコンの外に送られません"><span class="dot"></span>ローカル処理</span>
      <button class="pill" id="quit-btn" title="faceswapjp を終了" style="cursor:pointer">⏻ 終了</button>
    </header>
    <div class="shell">
      <nav class="rail" id="rail"></nav>
      <main class="stage">
        <div class="viewer" id="viewer"></div>
        <div class="timeline hidden" id="timeline"></div>
      </main>
      <aside class="inspector" id="inspector"></aside>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="jobbar" class="hidden"></div>
  <dialog id="modal"></dialog>
  <input type="file" id="file-target" class="hidden" accept="video/*,image/*,.mov,.mxf,.mts,.m2ts,.mkv">
  <script type="module" src="/static/app.js"></script>
</body>
</html>
